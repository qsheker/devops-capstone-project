apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: database_uri
      type: string
      default: sqlite:////tmp/accounts-tests.sqlite
    - name: args
      type: array
      default: ["-v"]
  steps:
    - name: nosetests
      image: python:3.9-bookworm
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
        - name: COVERAGE_FILE
          value: /tmp/accounts-coverage
      args: ["$(params.args[*])"]
      script: |
        #!/bin/sh
        set -eu
        pip install --disable-pip-version-check -r requirements.txt
        python -m nose "$@"
        coverage report --fail-under=95
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-accounts
spec:
  workspaces:
    - name: source
  params:
    - name: image
      type: string
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.17
      workingDir: $(workspaces.source.path)
      env:
        - name: ACCOUNTS_IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        oc set image --local -f deploy/deployment.yaml "accounts=$ACCOUNTS_IMAGE" -o yaml > /tmp/accounts-deployment.yaml
        oc apply -f /tmp/accounts-deployment.yaml
        oc apply -f deploy/service.yaml
        oc rollout status deployment/accounts --timeout=180s
        oc get deployment,pod,service -l app=accounts -o wide
