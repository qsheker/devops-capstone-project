apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  labels:
    app: accounts
spec:
  replicas: 1
  selector:
    matchLabels: {app: accounts}
  template:
    metadata:
      labels: {app: accounts}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: accounts
          image: IMAGE_NAME_HERE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: DATABASE_HOST, value: postgresql}
            - name: DATABASE_NAME
              valueFrom: {secretKeyRef: {name: postgresql, key: database-name}}
            - name: DATABASE_USER
              valueFrom: {secretKeyRef: {name: postgresql, key: database-user}}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: postgresql, key: database-password}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
