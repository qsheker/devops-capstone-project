name: Accounts CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: accounts
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accounts"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URI: postgresql://postgres:ci_only@127.0.0.1:5432/accounts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make lint
      - run: make tests
      - run: coverage report --fail-under=95
